<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload — Vision-Net</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <a href="/" class="header-logo">
      <span class="logo-icon">◎</span>
      <span>Vision-Net</span>
    </a>
    <span class="header-title">Upload File</span>
    <nav class="header-nav">
      <button class="nav-btn" onclick="location.href='/'">Home</button>
    </nav>
  </header>

  <div class="page-content">
    <div class="upload-wrapper">
      <form class="upload-card" id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
        <h2>Upload EO/IR File</h2>
        <p class="upload-desc">Select an image or video file for target detection analysis.</p>

        <!-- Drop Zone -->
        <div class="drop-zone" id="dropZone">
          <span class="drop-zone-icon">⬆</span>
          <p class="drop-zone-text">Drag &amp; drop your file here or <span class="browse">browse</span></p>
          <p class="drop-zone-hint">Supports JPG, PNG, MP4, AVI, MOV</p>
        </div>

        <input type="file" name="file" id="fileInput" class="file-input-hidden" accept="image/*,video/*" required />

        <!-- Preview Area -->
        <div class="preview-area" id="previewArea">
          <p class="preview-label">Preview</p>
          <img id="imagePreview" class="preview-media" style="display:none;" alt="Image preview" />
          <video id="videoPreview" class="preview-media" controls muted style="display:none;"></video>
          <p class="file-name" id="fileName"></p>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" id="submitBtn">Run Detection</button>
      </form>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const videoPreview = document.getElementById('videoPreview');
    const previewArea = document.getElementById('previewArea');
    const fileName = document.getElementById('fileName');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');

    // Click drop zone to browse
    dropZone.addEventListener('click', () => fileInput.click());

    // Drag & drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // File selected
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      const blobURL = URL.createObjectURL(file);

      imagePreview.style.display = 'none';
      videoPreview.style.display = 'none';

      if (file.type.startsWith('image/')) {
        imagePreview.src = blobURL;
        imagePreview.style.display = 'block';
      } else if (file.type.startsWith('video/')) {
        videoPreview.src = blobURL;
        videoPreview.style.display = 'block';
        videoPreview.load();
      }

      const sizeMB = (file.size / 1024 / 1024).toFixed(1);
      fileName.textContent = `${file.name} (${sizeMB} MB)`;

      previewArea.classList.add('active');
      submitBtn.classList.add('visible');
      dropZone.style.display = 'none';
    }

    // Loading state on submit
    uploadForm.addEventListener('submit', () => {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing… Please wait';
    });
  </script>

</body>
</html>
